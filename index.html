<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استمارة محضر تنصيب مكتب الأمانة الولائية</title>
  
  <!-- استيراد خطوط النسخ الرسمية المطابقة للوثائق الجزائرية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@700&family=Noto+Naskh+Arabic:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 10px;
      background-color: #2c3e50;
      font-family: 'Amiri', 'Traditional Arabic', Tahoma, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* شريط الأدوات العلوي */
    .controls {
      background: #ffffff;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      width: 95%;
      max-width: 850px;
    }

    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      color: white;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-action { background-color: #4b6584; }
    .btn-action:active { transform: scale(0.95); }
    .btn-save { background-color: #20bf6b; }
    .btn-print { background-color: #0fb9b1; }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #f1f2f6;
      padding: 4px 8px;
      border-radius: 6px;
    }

    select {
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid #ced6e0;
      font-family: inherit;
      font-weight: bold;
      outline: none;
    }

    /* مساحة عرض المستند */
    .editor-wrapper {
      position: relative;
      width: 100%;
      max-width: 794px;
      background: white;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      line-height: 0;
    }

    .base-image {
      width: 100%;
      display: block;
      height: auto;
    }

    /* حقول الإدخال */
    .inputs-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    input.field {
      position: absolute;
      background: rgba(255, 255, 255, 0.75);
      border: 1px dashed #2980b9;
      font-weight: bold;
      color: #000000;
      text-align: center;
      padding: 0 2px;
      box-sizing: border-box;
      outline: none;
      transition: background 0.2s;
    }

    input.field:focus {
      background: #ffffff;
      border: 1.5px solid #e67e22;
      z-index: 10;
    }

    #renderCanvas {
      display: none;
    }
  </style>
</head>
<body>

  <!-- شريط التحكم الكامل بالخط والحجم والحفظ -->
  <div class="controls">
    <label style="font-size: 13px; font-weight: bold;">صورة المستند:</label>
    <input type="file" id="imagePicker" accept="image/*" style="max-width: 170px; font-size: 12px;">

    <!-- أزرار تكبير وتصغير الخط -->
    <div class="tool-group">
      <span style="font-size: 13px; font-weight: bold;">حجم الخط:</span>
      <button class="btn btn-action" onclick="changeFontSize(-1)" title="تصغير">A-</button>
      <span id="fontSizeDisplay" style="font-weight: bold; min-width: 25px; text-align: center;">13</span>
      <button class="btn btn-action" onclick="changeFontSize(1)" title="تكبير">A+</button>
    </div>

    <!-- اختيار نوع الخط المطابق للنموذج -->
    <div class="tool-group">
      <span style="font-size: 13px; font-weight: bold;">نوع الخط:</span>
      <select id="fontFamilySelector" onchange="updateFontFamily()">
        <option value="'Amiri', 'Traditional Arabic', serif" selected>الأميري (مطابق للوثيقة)</option>
        <option value="'Noto Naskh Arabic', sans-serif">النسخ الرسمي (Noto Naskh)</option>
        <option value="'Cairo', sans-serif">خط القاهرة (واضح جداً)</option>
        <option value="'Traditional Arabic', Tahoma, sans-serif">الخط العربي التقليدي</option>
      </select>
    </div>

    <!-- أزرار التصدير والطباعة -->
    <button class="btn btn-save" onclick="exportAsImage()">💾 حفظ كصورة (PNG)</button>
    <button class="btn btn-print" onclick="printDocument()">🖨️ طباعة</button>
  </div>

  <!-- مساحة إدخال البيانات فوق الصورة -->
  <div class="editor-wrapper" id="editorContainer">
    <img id="mainDocImage" class="base-image" src="1000128007.jpg" alt="المستند">
    
    <div class="inputs-layer" id="fieldsLayer">
      <!-- 1. ولاية العنوان -->
      <input type="text" class="field" data-x="12" data-y="23.3" data-w="17" data-h="2.2" style="top: 23.3%; left: 12%; width: 17%; height: 2.2%;" placeholder="الولاية">

      <!-- 2. تاريخ التنصيب والولاية -->
      <input type="text" class="field" data-x="54.5" data-y="34.0" data-w="9" data-h="2.2" style="top: 34.0%; left: 54.5%; width: 9%; height: 2.2%;" placeholder="الولاية">
      <input type="text" class="field" data-x="24.5" data-y="34.0" data-w="4.5" data-h="2.2" style="top: 34.0%; left: 24.5%; width: 4.5%; height: 2.2%;" placeholder="سنة">
      <input type="text" class="field" data-x="17.5" data-y="34.0" data-w="4.5" data-h="2.2" style="top: 34.0%; left: 17.5%; width: 4.5%; height: 2.2%;" placeholder="شهر">
      <input type="text" class="field" data-x="7.5" data-y="34.0" data-w="5.5" data-h="2.2" style="top: 34.0%; left: 7.5%; width: 5.5%; height: 2.2%;" placeholder="يوم">

      <!-- 3. خلايا الجدول الـ 9 صفوف -->
      <div id="tableInputs"></div>

      <!-- 4. ولاية المهام أسفل الجدول -->
      <input type="text" class="field" data-x="39" data-y="76.5" data-w="9.5" data-h="2.2" style="top: 76.5%; left: 39%; width: 9.5%; height: 2.2%;" placeholder="الولاية">

      <!-- 5. نسخة موجهة إلى -->
      <input type="text" class="field" data-x="67" data-y="83.8" data-w="8" data-h="2.2" style="top: 83.8%; left: 67%; width: 8%; height: 2.2%;" placeholder="الولاية">
      <input type="text" class="field" data-x="68" data-y="87.8" data-w="8.5" data-h="2.2" style="top: 87.8%; left: 68%; width: 8.5%; height: 2.2%;" placeholder="الولاية">
      <input type="text" class="field" data-x="68" data-y="90.0" data-w="8.5" data-h="2.2" style="top: 90.0%; left: 68%; width: 8.5%; height: 2.2%;" placeholder="الولاية">
    </div>
  </div>

  <canvas id="renderCanvas"></canvas>

  <script>
    let currentFontSize = 13;
    let currentFontFamily = "'Amiri', 'Traditional Arabic', serif";

    // توليد خلايا الجدول
    const tableContainer = document.getElementById('tableInputs');
    const cols = [
      { left: 80.5, width: 13.0 }, // اللقب والاسم
      { left: 71.0, width: 9.0 },  // الوظيفة
      { left: 52.0, width: 18.5 }, // رقم NIN
      { left: 38.0, width: 13.5 }, // رقم الضمان الاجتماعي
      { left: 21.0, width: 16.5 }, // المهمة النقابية
      { left: 2.2,  width: 18.3 }  // مكان العمل
    ];

    const rowStartTop = 43.1;
    const rowHeight = 2.85;

    for (let r = 0; r < 9; r++) {
      const topPos = rowStartTop + (r * rowHeight);
      cols.forEach(col => {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'field';
        inp.setAttribute('data-x', col.left);
        inp.setAttribute('data-y', topPos);
        inp.setAttribute('data-w', col.width);
        inp.setAttribute('data-h', 2.2);
        inp.style.top = topPos + '%';
        inp.style.left = col.left + '%';
        inp.style.width = col.width + '%';
        inp.style.height = '2.4%';
        tableContainer.appendChild(inp);
      });
    }

    // تطبيق الخط والحجم على كافة الحقول
    function applyFontStyles() {
      const allInputs = document.querySelectorAll('input.field');
      allInputs.forEach(input => {
        input.style.fontSize = currentFontSize + 'px';
        input.style.fontFamily = currentFontFamily;
      });
      document.getElementById('fontSizeDisplay').innerText = currentFontSize;
    }

    // وظيفة تكبير/تصغير الخط
    function changeFontSize(delta) {
      currentFontSize = Math.min(Math.max(currentFontSize + delta, 9), 22);
      applyFontStyles();
    }

    // وظيفة تغيير نوع الخط
    function updateFontFamily() {
      currentFontFamily = document.getElementById('fontFamilySelector').value;
      applyFontStyles();
    }

    // تطبيق أولي للخط
    applyFontStyles();

    // استيراد صورة من الهاتف
    const imgElement = document.getElementById('mainDocImage');
    document.getElementById('imagePicker').addEventListener('change', function(e) {
      if (e.target.files && e.target.files[0]) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          imgElement.src = evt.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    // رسم المحتوى وتصديره مع تطبيق نوع الخط وحجمه بدقة
    function renderToCanvas(callback) {
      const canvas = document.getElementById('renderCanvas');
      const ctx = canvas.getContext('2d');

      canvas.width = imgElement.naturalWidth || 1000;
      canvas.height = imgElement.naturalHeight || 1414;

      // رسم خلفية الصورة
      ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#000000';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // احتساب نسبة التكبير بالنسبة لأبعاد الصورة الأصلية
      const scaleFactor = canvas.width / (document.getElementById('editorContainer').clientWidth || 794);
      const canvasFontSize = Math.round(currentFontSize * scaleFactor);

      // تطبيق نفس الخط المختار على لوحة الرسم
      ctx.font = `bold ${canvasFontSize}px ${currentFontFamily}`;

      const allInputs = document.querySelectorAll('input.field');
      allInputs.forEach(input => {
        const text = input.value.trim();
        if (text) {
          const xPercent = parseFloat(input.getAttribute('data-x'));
          const yPercent = parseFloat(input.getAttribute('data-y'));
          const wPercent = parseFloat(input.getAttribute('data-w'));
          const hPercent = parseFloat(input.getAttribute('data-h'));

          const fieldX = (xPercent / 100) * canvas.width;
          const fieldY = (yPercent / 100) * canvas.height;
          const fieldW = (wPercent / 100) * canvas.width;
          const fieldH = (hPercent / 100) * canvas.height;

          const textCenterX = fieldX + (fieldW / 2);
          const textCenterY = fieldY + (fieldH / 2);

          ctx.fillText(text, textCenterX, textCenterY);
        }
      });

      if (callback) callback(canvas);
    }

    // حفظ كصورة في الهاتف
    function exportAsImage() {
      renderToCanvas(function(canvas) {
        const link = document.createElement('a');
        link.download = 'محضر_تنصيب_مكتمل.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    // طباعة بدون شاشة بيضاء
    function printDocument() {
      renderToCanvas(function(canvas) {
        const dataUrl = canvas.toDataURL('image/png');
        const printWindow = window.open('', '_blank');
        if (printWindow) {
          printWindow.document.write(`
            <html>
              <head>
                <title>طباعة المحضر</title>
                <style>
                  @page { size: auto; margin: 0; }
                  body { margin: 0; display: flex; justify-content: center; align-items: center; }
                  img { width: 100%; height: auto; max-height: 100vh; object-fit: contain; }
                </style>
              </head>
              <body onload="window.print(); window.close();">
                <img src="${dataUrl}" />
              </body>
            </html>
          `);
          printWindow.document.close();
        } else {
          alert('يرجى السماح بالنوافذ المنبثقة أو استخدام زر الحفظ كصورة.');
        }
      });
    }
  </script>
</body>
</html>
