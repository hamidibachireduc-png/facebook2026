<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ البطاقات البيومترية</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 20px; }
        video { border: 2px solid #333; border-radius: 8px; max-width: 100%; background: #eee; }
        button { margin-top: 20px; padding: 15px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        #error-msg { color: red; font-weight: bold; margin: 10px; padding: 10px; }
    </style>
</head>
<body>

    <h2>وجه الكاميرا نحو البطاقة</h2>
    <!-- مساحة لعرض أخطاء الصلاحيات مباشرة على الشاشة -->
    <div id="error-msg"></div>
    
    <video id="camera" width="300" height="200" autoplay playsinline></video>
    <br>
    <button id="scanBtn">استخراج الرقم (NIN)</button>
    <h3 id="result" style="color: blue;">النتيجة ستظهر هنا...</h3>

    <script>
        const video = document.getElementById('camera');
        const resultText = document.getElementById('result');
        const errorMsg = document.getElementById('error-msg');

        // دالة طلب صلاحيات الكاميرا مع معالجة الأخطاء
        async function startCamera() {
            try {
                // نطلب الكاميرا الخلفية تحديداً
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                errorMsg.innerText = ""; // مسح الأخطاء إن نجح الاتصال
            } catch (err) {
                // التقاط الخطأ وعرضه للمستخدم باللغة العربية
                if (err.name === "NotAllowedError") {
                    errorMsg.innerText = "❌ لقد قمت برفض صلاحية الوصول للكاميرا، يرجى تفعيلها من إعدادات المتصفح.";
                } else if (err.name === "NotFoundError") {
                    errorMsg.innerText = "❌ لم يتم العثور على كاميرا في هذا الجهاز.";
                } else {
                    errorMsg.innerText = "❌ تم حظر الكاميرا. تأكد أن الرابط يبدأ بـ HTTPS وليس HTTP.\nالخطأ التقني: " + err.message;
                }
            }
        }

        // تشغيل الكاميرا فور فتح الصفحة
        startCamera();

        document.getElementById('scanBtn').onclick = async () => {
            resultText.innerText = "جاري القراءة، يرجى الانتظار...";
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            const { data: { text } } = await Tesseract.recognize(canvas, 'eng');
            
            // البحث عن رقم NIN المكون من 18 رقم
            const ninMatch = text.match(/\b\d{18}\b/);
            
            if (ninMatch) {
                resultText.innerText = `الرقم الوطني: ${ninMatch[0]}`;
            } else {
                resultText.innerText = "لم يتم العثور على الرقم، حاول تقريب البطاقة أو تحسين الإضاءة.";
            }
        };
    </script>

</body>
</html>
