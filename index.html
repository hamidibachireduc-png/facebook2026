        // --- دوال مساعدة ---
        function formatWhatsAppNumber(phone) {
            if (!phone) return "";
            // يأخذ أول رقم يجده في حال وجود رقمين مفصولين بـ / أو -
            let firstPhone = phone.split(/[\/\-]/)[0].trim();
            let cleaned = firstPhone.replace(/\D/g, '');
            if (cleaned.startsWith('0')) cleaned = '213' + cleaned.substring(1);
            return cleaned;
        }

            container.innerHTML = html;
        }

        // بناء قائمة اختيار الولايات
        function populateWilayas() {
            const select = document.getElementById('wilayaName');
            if (select.options.length <= 1) { 
                select.innerHTML = '<option value="" disabled selected>اختر الأمانة الولائية...</option>';
                wilayasList.forEach(wilaya => { select.innerHTML += `<option value="${wilaya}">${wilaya}</option>`; });
            }
        }

        // تحويل الصورة لـ Base64
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) { document.getElementById('photoBase64').value = event.target.result; };
                reader.readAsDataURL(file);
            }
        });

        // عرض بطاقات الولايات
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            secretariats.forEach((item, index) => {
                if (item.wilayaName.toLowerCase().includes(searchTerm) || item.sgName.toLowerCase().includes(searchTerm)) {
                    const waNumber = formatWhatsAppNumber(item.phone);
                    const defaultAvatar = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
                    const avatar = item.photo || defaultAvatar;

                    container.innerHTML += `
                        <div class="bg-white rounded-xl shadow border border-gray-200 overflow-hidden hover:shadow-lg transition-shadow">
                            <div class="bg-green-800 text-white p-3 flex justify-between items-center">
                                <h3 class="font-bold text-sm truncate w-3/4"><i class="fa-solid fa-location-dot ml-1 text-red-400"></i> ${item.wilayaName}</h3>
                                <div class="flex space-x-2 space-x-reverse">
                                    <button onclick="editEntry(${index})" class="text-blue-200 hover:text-white" title="تعديل"><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button onclick="deleteEntry(${index})" class="text-red-300 hover:text-white" title="حذف"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            
                            <div class="p-4 flex items-center">
                                <img src="${avatar}" class="w-16 h-16 rounded-full border-2 border-green-500 ml-4 object-cover shadow">
                                <div>
                                    <p class="font-bold text-lg text-gray-800">👨 ${item.sgName}</p>
                                    <p class="text-sm text-gray-500 mt-1 line-clamp-2" title="${item.address}">🏦 ${item.address || 'غير محدد'}</p>
                                </div>
                            </div>

                            <div class="bg-gray-50 p-3 border-t flex justify-around card-actions">
                                <a href="${item.phone ? 'tel:' + item.phone : '#'}" class="text-blue-600 bg-blue-100 p-2 rounded-full w-10 h-10 flex items-center justify-center" title="اتصال"><i class="fa-solid fa-phone"></i></a>
                                <a href="${waNumber ? 'https://wa.me/' + waNumber : '#'}" target="_blank" class="text-green-600 bg-green-100 p-2 rounded-full w-10 h-10 flex items-center justify-center" title="واتساب"><i class="fa-brands fa-whatsapp text-lg"></i></a>
                                <a href="${item.email ? 'mailto:' + item.email : '#'}" class="${item.email ? 'text-red-500 bg-red-100' : 'text-gray-300 bg-gray-100 pointer-events-none'} p-2 rounded-full w-10 h-10 flex items-center justify-center" title="إيميل"><i class="fa-solid fa-envelope"></i></a>
                                <a href="${item.mapsLink ? item.mapsLink : '#'}" target="_blank" class="${item.mapsLink ? 'text-yellow-600 bg-yellow-100' : 'text-gray-300 bg-gray-100 pointer-events-none'} p-2 rounded-full w-10 h-10 flex items-center justify-center" title="الخريطة"><i class="fa-solid fa-map-location-dot"></i></a>
                            </div>
                        </div>
                    `;
                }
            });
        }

        // --- وظائف النافذة (Modal) والإرسال ---
        function openModal() {
            populateWilayas();
            document.getElementById('formModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('formModal').classList.add('hidden');
            document.getElementById('dataForm').reset();
            document.getElementById('editIndex').value = "-1";
            document.getElementById('photoBase64').value = "";
            document.getElementById('includeMahdar').checked = false;
            document.getElementById('modalTitle').innerText = "إضافة أمانة ولائية جديدة";
        }

        function executeSave() {
            const index = document.getElementById('editIndex').value;
            const newData = {
                wilayaName: document.getElementById('wilayaName').value,
                sgName: document.getElementById('sgName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value,
                mapsLink: document.getElementById('mapsLink').value,
                photo: document.getElementById('photoBase64').value
            };

            if (index === "-1") { secretariats.push(newData); } 
            else { if(!newData.photo) newData.photo = secretariats[index].photo; secretariats[index] = newData; }

            try { localStorage.setItem('secretariats_data', JSON.stringify(secretariats)); } catch(e) {}
            renderCards();
            return newData;
        }

        function saveData(event) {
            event.preventDefault();
            executeSave();
            closeModal();
        }

        function buildShareMessage(data, includeMahdar) {
            let msg = `*${data.wilayaName}*\n👨 الأمين العام: ${data.sgName}\n📞 الهاتف: ${data.phone}\n`;
            if (data.email) msg += `📧 البريد: ${data.email}\n`;
            if (data.address) msg += `🏦 المقر: ${data.address}\n`;
            if (data.mapsLink) msg += `📍 الخريطة: ${data.mapsLink}\n`;
            if (includeMahdar) msg += `\n📄 *إشعار هام:* نعلمكم أنه تم رسمياً تنصيب الأمانة الولائية وإعداد محضر التنصيب الخاص بذلك.`;
            return msg;
        }

        function saveAndShare(type) {
            const form = document.getElementById('dataForm');
            if (!form.checkValidity()) { form.reportValidity(); return; }

            const savedData = executeSave();
            const includeMahdar = document.getElementById('includeMahdar').checked;

            if (type === 'whatsapp') {
                const targetPhone = document.getElementById('targetWhatsapp').value;
                if (!targetPhone) { alert('يرجى إدخال رقم واتساب المستلم.'); return; }
                const waNumber = formatWhatsAppNumber(targetPhone);
                const msg = encodeURIComponent(buildShareMessage(savedData, includeMahdar));
                window.open(`https://wa.me/${waNumber}?text=${msg}`, '_blank');
            } 
            else if (type === 'email') {
                const targetEmail = document.getElementById('targetEmail').value;
                if (!targetEmail) { alert('يرجى إدخال إيميل المستلم.'); return; }
                const msg = encodeURIComponent(buildShareMessage(savedData, includeMahdar));
                const subject = encodeURIComponent('بيانات الأمانة الولائية: ' + savedData.wilayaName);
                window.open(`mailto:${targetEmail}?subject=${subject}&body=${msg}`, '_blank');
            }
            closeModal();
        }

        function editEntry(index) {
            populateWilayas();
            const data = secretariats[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('wilayaName').value = data.wilayaName;
            document.getElementById('sgName').value = data.sgName;
            document.getElementById('phone').value = data.phone;
            document.getElementById('email').value = data.email || "";
            document.getElementById('address').value = data.address || "";
            document.getElementById('mapsLink').value = data.mapsLink || "";
            document.getElementById('modalTitle').innerText = "تعديل بيانات: " + data.wilayaName;
            document.getElementById('targetWhatsapp').value = '';
            document.getElementById('targetEmail').value = '';
            document.getElementById('includeMahdar').checked = false;
            document.getElementById('formModal').classList.remove('hidden');
        }

        function deleteEntry(index) {
            if (confirm("هل أنت متأكد من حذف هذه البيانات؟")) {
                secretariats.splice(index, 1);
                try { localStorage.setItem('secretariats_data', JSON.stringify(secretariats)); } catch(e) {}
                renderCards();
            }
        }

        // الاستدعاءات الأولية عند فتح الصفحة
        renderRegions();
        populateWilayas();
        renderCards();
    </script>
</body>
</html>
